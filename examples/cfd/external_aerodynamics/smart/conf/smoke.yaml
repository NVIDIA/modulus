defaults:
  - config
  - _self_

output_dir: ./runs/smoke
model:
  hidden_dim: 24
  num_heads: 4
  num_layers: 2
  num_latents: 8
  geometry_subsample: 16
  parameter_channels: 2
data:
  surface_points: 32
  volume_points: 40
  parameter_mean: [0.0, 0.0]
  parameter_std: [1.0, 1.0]
  prefetch: 0
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.003
training:
  epochs: 3
  precision: float32
validation:
  chunk_size: 31
