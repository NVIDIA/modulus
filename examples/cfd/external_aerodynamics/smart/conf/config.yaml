defaults:
  - _self_

seed: 42
output_dir: ./runs/smart

model:
  surface_channels: 1
  volume_channels: 3
  parameter_channels: 0
  hidden_dim: 256
  num_heads: 8
  num_layers: 6
  num_latents: 2048
  geometry_subsample: 65536
  mlp_ratio: 4
  share_weights: true
  eval_seed: 0

data:
  train_path: ./data/train
  val_path: ./data/val
  surface_points: 16384
  volume_points: 16384
  coordinate_center: [0.0, 0.0, 0.0]
  coordinate_scale: [1.0, 1.0, 1.0]
  parameter_mean: []
  parameter_std: []
  workers: 2
  prefetch: 2

optimizer:
  _target_: lion_pytorch.Lion
  lr: 0.0001
  betas: [0.9, 0.99]
  weight_decay: 0.0

training:
  epochs: 200
  # Optional exact successful-update endpoint; overrides the epoch endpoint.
  max_updates: null
  # The generic recipe uses epoch scheduling; DrivAerML uses update scheduling.
  scheduler_interval: epoch
  batch_size: 1
  precision: float16
  gradient_clip: 0.0
  resume: false
  initial_weights: null

validation:
  chunk_size: 16384

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra
  output_subdir: null
